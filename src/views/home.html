<style>
/* Startseite: Foto zuerst, wenig Text, ein Lesefluss von oben nach unten (Aufbau wie bei den großen Maklerhäusern) */
.hx{background:var(--paper)}
.hx-eye{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}
.hx-h{font-family:var(--serif);font-weight:500;font-size:clamp(34px,4.4vw,58px);line-height:1.06;letter-spacing:-.01em;color:var(--fg)}
.hx-head{text-align:center;max-width:760px;margin:0 auto 54px;display:grid;gap:16px}
.hx-head p{color:var(--mute);font-size:17px;line-height:1.6}
.hx-sec{padding:110px 0}
.hx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 30px;border-radius:999px;background:var(--fg);color:#0d1211;font-weight:600;font-size:15px;border:1px solid var(--fg);transition:background .2s,color .2s}
.hx-btn:hover{background:transparent;color:var(--fg)}
.hx-btn--line{background:transparent;color:var(--fg);border-color:rgba(255,255,255,.45)}
.hx-btn--line:hover{background:var(--fg);color:#0d1211}
.hx-btn--wa{background:var(--wa);border-color:var(--wa);color:#fff}
.hx-btn--wa:hover{background:#178f4a;border-color:#178f4a;color:#fff}
.hx-btn .ico{width:18px;height:18px}

/* 1 Kopfbild */
.hx-hero{position:relative;min-height:min(92vh,900px);display:grid;place-items:center;text-align:center;color:#fff;overflow:hidden}
.hx-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hx-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,10,.62) 0%,rgba(7,11,10,.18) 34%,rgba(7,11,10,.38) 62%,rgba(13,18,17,1) 100%)}
.hx-hero__in{position:relative;z-index:1;padding:150px 24px 120px;display:grid;gap:26px;justify-items:center;max-width:980px}
.hx-hero .hx-eye{color:#fff;opacity:.9}
.hx-hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,7.4vw,104px);line-height:.98;letter-spacing:-.015em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hx-hero p{font-size:clamp(16px,1.5vw,19px);line-height:1.55;max-width:560px;color:rgba(255,255,255,.92)}
.hx-find{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:6px;border-radius:999px;background:rgba(13,18,17,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22)}
.hx-find a{height:48px;padding:0 26px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:#fff;transition:background .2s,color .2s}
.hx-find a:hover{background:rgba(255,255,255,.16)}
.hx-find a.on{background:#fff;color:#0d1211}
.hx-find a .ico{width:16px;height:16px}

/* 2 Objekt der Woche */
.hx-feat{display:block;position:relative;border-radius:var(--r);overflow:hidden}
.hx-feat__ph{aspect-ratio:16/8;overflow:hidden;border-radius:var(--r)}
.hx-feat__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.hx-feat:hover .hx-feat__ph img{transform:scale(1.03)}
.hx-feat__tag{position:absolute;left:22px;top:22px;padding:8px 16px;border-radius:999px;background:rgba(13,18,17,.6);backdrop-filter:blur(10px);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.hx-feat__b{display:flex;align-items:flex-end;justify-content:space-between;gap:30px;padding:30px 4px 0}
.hx-feat__b h3{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,48px);line-height:1.05;color:var(--fg)}
.hx-loc{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.hx-facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:14px;color:var(--mute);font-size:15px}
.hx-facts b{color:var(--fg);font-weight:600}
.hx-price{font-size:clamp(22px,2.2vw,30px);font-weight:600;color:var(--fg);white-space:nowrap;text-align:right}
.hx-price small{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-top:6px}

/* 3 Raster */
.hx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.hx-card{display:block}
.hx-card__ph{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:var(--white)}
.hx-card__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.hx-card:hover .hx-card__ph img{transform:scale(1.05)}
.hx-card__tag{position:absolute;left:14px;top:14px;padding:6px 12px;border-radius:999px;background:rgba(13,18,17,.62);backdrop-filter:blur(8px);color:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.hx-card__b{padding:20px 4px 0}
.hx-card h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;color:var(--fg)}
.hx-card .hx-loc{font-size:12px;margin-bottom:8px}
.hx-card .hx-facts{font-size:14px;margin-top:10px}
.hx-card__p{margin-top:12px;font-size:18px;font-weight:600;color:var(--fg)}
.hx-more{display:flex;justify-content:center;margin-top:56px}

/* Rechner */
.hx-calc{max-width:980px;margin:0 auto;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:36px}
.hx-calc .fx{margin-top:18px;color:var(--mute);font-size:13px}
@media (max-width:640px){.hx-calc{padding:20px}}

/* 4 Kategorien */
.hx-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.hx-cat{position:relative;display:block;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;color:#fff}
.hx-cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.hx-cat:hover img{transform:scale(1.06)}
.hx-cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,11,10,0) 40%,rgba(7,11,10,.82) 100%)}
.hx-cat__b{position:absolute;left:28px;right:28px;bottom:28px;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.hx-cat h3{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1}
.hx-cat span{font-size:14px;opacity:.85;display:block;margin-top:8px}
.hx-cat i{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.5);display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.hx-cat:hover i{background:#fff;color:#0d1211}
.hx-cat i .ico{width:18px;height:18px}

/* 5 Über uns */
.hx-band{background:var(--ink)}
.hx-about{display:grid;grid-template-columns:1.05fr 1fr;gap:70px;align-items:center}
.hx-about__ph{aspect-ratio:4/5;border-radius:var(--r);overflow:hidden}
.hx-about__ph img{width:100%;height:100%;object-fit:cover}
.hx-about__t{display:grid;gap:22px;justify-items:start}
.hx-about__t p{color:var(--mute);font-size:18px;line-height:1.65;max-width:520px}
.hx-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:26px 40px;margin:14px 0 10px;width:100%;max-width:520px;padding-top:30px;border-top:1px solid var(--line)}
.hx-stats b{display:block;font-family:var(--serif)!important;font-weight:500;font-size:64px!important;line-height:1;color:var(--fg);font-variant-numeric:lining-nums;letter-spacing:0!important}
.hx-stats span{display:block;margin-top:8px;font-size:14px;color:var(--mute)}

/* 6 Stimme */
.hx-quote{text-align:center;max-width:900px;margin:0 auto;display:grid;gap:30px;justify-items:center}
.hx-quote blockquote{font-family:var(--serif);font-weight:500;font-style:italic;font-size:clamp(26px,3.2vw,42px);line-height:1.25;color:var(--fg)}
.hx-quote cite{font-style:normal;font-size:15px;color:var(--mute)}
.hx-quote cite b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* 7 Blog */
.hx-post{display:block}
.hx-post__ph{aspect-ratio:3/2;border-radius:var(--r);overflow:hidden;background:var(--white)}
.hx-post__ph img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.7,.2,1)}
.hx-post:hover .hx-post__ph img{transform:scale(1.05)}
.hx-post h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.15;color:var(--fg);margin:8px 0 10px}
.hx-post p{color:var(--mute);font-size:15px;line-height:1.55}
.hx-post .hx-loc{margin:20px 0 0;font-size:12px}

/* 8 Fragen */
.hx-faq{max-width:820px;margin:0 auto}
.hx-faq details{border-bottom:1px solid var(--line)}
.hx-faq details:first-of-type{border-top:1px solid var(--line)}
.hx-faq summary{list-style:none;cursor:pointer;padding:26px 44px 26px 0;position:relative;font-size:20px;font-weight:500;color:var(--fg)}
.hx-faq summary::-webkit-details-marker{display:none}
.hx-faq summary::after{content:"+";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:26px;font-weight:300;color:var(--gold)}
.hx-faq details[open] summary::after{content:"–"}
.hx-faq p{padding:0 44px 28px 0;color:var(--mute);font-size:17px;line-height:1.65}

/* 9 Abschluss */
.hx-cta{position:relative;border-radius:var(--r);overflow:hidden;min-height:520px;display:grid;place-items:center;text-align:center;color:#fff}
.hx-cta img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hx-cta::after{content:"";position:absolute;inset:0;background:rgba(7,11,10,.58)}
.hx-cta__in{position:relative;z-index:1;padding:70px 24px;display:grid;gap:24px;justify-items:center;max-width:760px}
.hx-cta h2{font-family:var(--serif);font-weight:500;font-size:clamp(36px,5vw,68px);line-height:1.02}
.hx-cta p{font-size:18px;line-height:1.55;color:rgba(255,255,255,.9);max-width:520px}
.hx-cta__btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

@media (max-width:980px){
  .hx-sec{padding:76px 0}
  .hx-grid,.hx-cats{grid-template-columns:1fr 1fr;gap:20px}
  .hx-about{grid-template-columns:1fr;gap:40px}
  .hx-about__ph{aspect-ratio:4/3}
  .hx-feat__ph{aspect-ratio:4/3}
  .hx-feat__b{flex-direction:column;align-items:flex-start;gap:18px}
  .hx-price{text-align:left}
}
@media (max-width:640px){
  .hx-sec{padding:64px 0}
  .hx-head{margin-bottom:36px}
  .hx-grid,.hx-cats{grid-template-columns:1fr;gap:34px}
  .hx-cat{aspect-ratio:4/3}
  .hx-hero{min-height:88vh}
  .hx-hero__in{padding:120px 20px 90px;gap:22px}
  .hx-find{border-radius:26px;width:100%}
  .hx-find a{flex:1 1 auto;justify-content:center;padding:0 16px;height:46px}
  .hx-stats b{font-size:46px}
  .hx-faq summary{font-size:18px}
  .hx-cta{min-height:460px}
  .hx-btn{width:100%}
}
</style>
