    <dl class="hero__dl">
      <div><dt>${tr('hm_price')}</dt><dd class="num">${price(f)}</dd></div>
      <div><dt>${tr('hm_loc')}</dt><dd>${esc(f.loc)}</dd></div>
      <div><dt>${land?tr('t_terreno'):tr('hm_area')}</dt><dd class="num">${nf(land?f.lot:f.area)} m²</dd></div>
      <div><dt>${tr('hm_status')}</dt><dd>${tagText(f)}</dd></div>
    </dl>
    <span class="hero__go">${tr('hm_see')}${icon('arrow')}</span>
  </a>
</div>
</section>`}

  function about(){return `<section class="about"><div class="wide">
<div class="about__grid">
  <div class="about__side"><span>${tr('hm_aboutLab')}</span><a class="link" href="#sobre">${tr('hm_aboutGo')}${icon('arrow')}</a></div>
  <p class="about__say">${tr('hm_aboutSay').replace('{y}',SITE.stats.years)}</p>
</div>
<div class="about__pic"><img ${srcW(SITE.media.about)} alt="${tr('hm_aboutAlt')}" loading="lazy"></div>
</div></section>`}

  function feat(){
    const s=SITE.listings.filter(l=>l.deal==='venda'&&l.type!=='terreno'),p=s.filter(l=>!l.feat).concat(s.filter(l=>l.feat)).slice(0,3);
    return `<section class="feat"><div class="wrap">
<div class="feat__head"><h2 class="h2">${tr('hm_featA')} <em>${tr('hm_featB')}</em></h2><a class="btn" href="#imoveis">${tr('hm_featAll')}</a></div>
${p[0]?cardBig(p[0],tr('hm_featBtn')):''}
<div class="feat__two">${p.slice(1).map(cardPhoto).join('')}</div>
</div></section>`}

  function rows(){return `<section class="rows dark"><div class="wide">
<div class="rows__head"><h2 class="rows__h">${tr('hm_rowsA')} <em>${tr('hm_rowsB')}</em></h2>
  <p class="rows__n"><span>${tr('hm_rowsN')}</span><b class="num">${SITE.listings.length}</b></p></div>
<ol class="rows__list">${ROWS.map((r,i)=>`<li><a class="row" href="#${r[1]}">
  <span class="row__no num">0${i+1}</span><h3 class="row__t">${tr(r[0])}</h3>
  <ul class="row__pts">${['a','b','c','d'].map(k=>`<li>${icon('plus')}<span>${tr(r[0]+k)}</span></li>`).join('')}</ul>
  <span class="row__ph"><img ${srcW(r[2])} alt="" loading="lazy"></span>
  <span class="row__go">${icon('arrow')}</span></a></li>`).join('')}</ol>
</div></section>`}

  function proof(){const s=SITE.stats;return `<section class="proof"><div class="wide">
<h2 class="h2">${tr('hm_proofA')} <em>${tr('hm_proofB')}</em></h2>
<div class="proof__grid">
  <div class="proof__l">
    <div class="tile tile--rate"><p class="tile__s">${tr('hm_rateTop')}</p><div><p class="tile__rate num">${nf(s.rating,1)} <span>/ ${nf(5,1)}</span></p><p class="tile__s">${tr('hm_rateBot').replace('{n}',nf(s.reviews))}</p></div></div>
    <div class="tile tile--num"><p class="tile__s">${tr('hm_soldTop').replace('{y}',s.years)}</p><p><b class="tile__big num" data-count="${s.sold}">${nf(s.sold)}</b><span class="tile__s">${tr('hm_sold')}</span></p></div>
    <figure class="tile tile--quote"><span class="tile__flag">${tr('hm_flag')}</span><blockquote class="tile__q">${tr('hm_quote')}</blockquote><figcaption class="tile__who"><b>${tr('hm_who')}</b><span>${tr('hm_whoRole')}</span></figcaption></figure>
  </div>
  <div class="proof__pic"><img ${srcW(SITE.media.proof)} alt="${tr('hm_proofAlt')}" loading="lazy"></div>
</div>
</div></section>`}

  function blog(){const [a,...r]=SITE.posts;if(!a)return '';
    return `<section class="blog"><div class="wide"><div class="blog__grid">
<a class="blog__main" href="#artigo-${a.slug}">
  <div class="blog__ph"><img ${srcW(a.img)} alt="${esc(L(a.title))}" loading="lazy"></div>
  <div class="blog__cut"><p class="blog__meta">${esc(L(a.cat))} · ${fdate(a.date)}</p><h2 class="blog__t">${esc(L(a.title))}</h2><p class="blog__x">${esc(L(a.excerpt))}</p></div>
</a>
<div class="blog__side">${r.slice(0,3).map(p=>`<a class="bc" href="#artigo-${p.slug}"><h3 class="bc__t">${esc(L(p.title))}</h3><p class="bc__x">${esc(L(p.excerpt))}</p><span class="bc__go">${tr('hm_read')}${icon('up')}</span></a>`).join('')}
  <a class="link blog__all" href="#blog">${tr('hm_blogAll')}${icon('arrow')}</a></div>
</div></div></section>`}

  VIEWS.home={
    title(){return tr('hm_title')},
    render(){return `<div class="v-home">${hero()}${about()}${feat()}${rows()}${proof()}${blog()}</div>`},
    mount(root){
      const v=$('.v-home video',root),b=$('[data-hm="video"]',root);if(!v||!b)return;
      if(!st.paused){const p=v.play();if(p&&p.catch)p.catch(()=>{})}
      b.onclick=()=>{st.paused=!st.paused;if(st.paused)v.pause();else{const p=v.play();if(p&&p.catch)p.catch(()=>{})}
        b.innerHTML=st.paused?PLAY:PAUSE;b.setAttribute('aria-label',tr(st.paused?'hm_play':'hm_pause'))}}
  };
})();
</script>
